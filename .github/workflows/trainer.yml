name: Trainer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# A newer push makes an older review moot.
concurrency:
  group: trainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The model runs here, on a machine with no key that can change the repository.
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Anyone can comment on a public commit, so only the trainer's own comments
      # and those of people with access to this repository reach the model.
      - name: Collect past reviews and replies
        run: >
          gh api "repos/$GITHUB_REPOSITORY/comments" --paginate
          --jq '.[] | select(.user.login == "github-actions[bot]" or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
          | {author: .user.login, commit: .commit_id, created_at, body}'
          > past-comments.jsonl
        env:
          GH_TOKEN: ${{ github.token }}
      # If the model can't be reached, the comment explains how to fix that instead.
      - name: Try one tiny request to the model
        id: model
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://api.bayleaf.dev/v1/chat/completions \
            -H "Authorization: Bearer $TRAINER_TOKEN" -H 'Content-Type: application/json' \
            -d '{"model":"openrouter:z-ai/glm-5.3-flash","max_tokens":16,"messages":[{"role":"user","content":"Hi"}]}') || status=none
          [ -n "$TRAINER_TOKEN" ] || status=missing
          case "$status" in
            200) echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            missing) reason="this repository has no TRAINER_TOKEN secret." ;;
            401) reason="its token has expired or was revoked." ;;
            403) reason="its token doesn't include the model it needs." ;;
            429) reason="your BayLeaf allowance is used up for now. This usually fixes itself within a day, with no steps needed." ;;
            *) reason="BayLeaf didn't answer as expected (status $status). If the steps below don't help, try again later." ;;
          esac
          sed -e "s|REASON|$reason|" -e "s|REPOSITORY|$GITHUB_REPOSITORY|" trainer/SETUP-HELP.md > review.md
          echo "::warning title=Trainer not ready::$reason"
        env:
          TRAINER_TOKEN: ${{ secrets.TRAINER_TOKEN }}
      - if: steps.model.outputs.ready == 'true'
        run: npm install --global @opencode/cli
      - name: Review this push
        if: steps.model.outputs.ready == 'true'
        run: opencode run --standalone --agent trainer "Review the push from $BEFORE to $GITHUB_SHA."
        env:
          TRAINER_TOKEN: ${{ secrets.TRAINER_TOKEN }}
          BEFORE: ${{ github.event.before }}
          OPENCODE_DISABLE_FREE_MODELS: "1"
      - name: Check a review was written
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s review.md ]; then
            echo "::error title=No review::The agent ran but wrote no review. Check the log above."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: review.md
          retention-days: 1

  # This key can push code, so it lives on a separate machine, with no model and
  # none of the repository's code. Green means a comment was delivered, whatever
  # it says. Red means the trainer itself failed.
  post:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review
      - name: Comment on the commit
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@review.md
        env:
          GH_TOKEN: ${{ github.token }}
