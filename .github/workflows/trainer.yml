name: Trainer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

# A newer push makes an older review moot.
concurrency:
  group: trainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.7
      - name: Review this push
        run: deno task review
        env:
          TRAINER_TOKEN: ${{ secrets.TRAINER_TOKEN }}
          TRAINER_BEFORE: ${{ github.event.before }}
