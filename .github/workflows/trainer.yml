name: Trainer

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# The key is the fence. contents: read lets the trainer read code and comments
# and *create* commit comments, but not push, edit, or delete anything, so its
# record of past reviews is append-only. Nothing here depends on the game's own
# build passing.
permissions:
  contents: read

# A newer push makes an older review moot.
concurrency:
  group: trainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check the trainer is set up
        id: token
        run: |
          if [ -z "$TRAINER_TOKEN" ]; then
            echo "::warning title=Trainer not set up::Run deno task trainer:setup (see README.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          TRAINER_TOKEN: ${{ secrets.TRAINER_TOKEN }}
      - name: Install OpenCode
        if: steps.token.outputs.ready == 'true'
        run: |
          npm install --global @opencode/cli
          mkdir -p ~/.config/opencode && echo '{"update":"disable"}' > ~/.config/opencode/opencode.json
      - name: Review this push
        if: steps.token.outputs.ready == 'true'
        run: |
          case "$BEFORE" in
            ""|*[!0]*) ;;
            *) BEFORE="" ;;
          esac
          opencode run --standalone --agent trainer \
            "Review the push ending at ${GITHUB_SHA} in ${GITHUB_REPOSITORY}. Previous head: ${BEFORE:-none, review the repository as it stands}." \
            | tee trainer-output.txt
        env:
          TRAINER_TOKEN: ${{ secrets.TRAINER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          OPENCODE_DISABLE_FREE_MODELS: "1"
      # Green means the trainer delivered a review, whatever the review says.
      # Red means only that the trainer itself failed. The comment is the main
      # outcome; this page keeps the technical detail.
      - name: Confirm the review was posted
        if: steps.token.outputs.ready == 'true'
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" \
            --jq '[.[] | select(.user.login == "github-actions[bot]")] | last | .html_url // empty')
          if [ -z "$url" ]; then
            echo "::error title=Trainer posted nothing::No comment on this commit. If the log shows a 401, run deno task trainer:setup again."
            exit 1
          fi
          {
            echo "**[Read the trainer's review on this commit]($url)**"
            echo
            echo "<details><summary>Agent output</summary>"
            echo
            cat trainer-output.txt
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          GH_TOKEN: ${{ github.token }}
