# Instructions, setup, and how to opt out are in REVIEWBOT.md.
name: Review Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# A newer push makes an older review moot.
concurrency:
  group: review-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The model runs here and may do anything: run the game, install tools, browse the
  # web. This machine has no key that can change the repository, and only the text of
  # review.md leaves it.
  review:
    if: true # OPT OUT: change true to false to turn the review bot off.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.model.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Anyone can comment on a public commit, so only the bot's own comments and
      # those of people with access to this repository reach the model.
      - name: Collect past reviews and replies
        run: >
          gh api "repos/$GITHUB_REPOSITORY/comments" --paginate
          --jq '.[] | select(.user.login == "github-actions[bot]" or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
          | {author: .user.login, commit: .commit_id, created_at, body}'
          > past-comments.jsonl
        env:
          GH_TOKEN: ${{ github.token }}
      # If the model can't be reached, the comment explains how to fix that instead.
      - name: Try one tiny request to the model
        id: model
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://api.bayleaf.dev/v1/chat/completions \
            -H "Authorization: Bearer $REVIEW_BOT_TOKEN" -H 'Content-Type: application/json' \
            -d '{"model":"openrouter:z-ai/glm-5.3-flash","max_tokens":16,"messages":[{"role":"user","content":"Hi"}]}') || status=none
          [ -n "$REVIEW_BOT_TOKEN" ] || status=missing
          case "$status" in
            200) echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            missing) reason="this repository has no REVIEW_BOT_TOKEN secret." ;;
            401) reason="its token has expired or was revoked." ;;
            403) reason="its token doesn't include the model it needs." ;;
            429) reason="your BayLeaf allowance is used up for now. This usually fixes itself within a day." ;;
            *) reason="BayLeaf didn't answer as expected (status $status). If setup looks right, try again later." ;;
          esac
          repo="https://github.com/$GITHUB_REPOSITORY"
          cat > review.md <<EOF
          **Your review bot can't review this push yet: $reason**

          This comment and the red X on the **Review Bot** workflow come back on every push until you do one of two things:

          - **Set up:** create a token on the [BayLeaf dashboard](https://api.bayleaf.dev/dashboard), then save it as a [secret named REVIEW_BOT_TOKEN]($repo/settings/secrets/actions/new). [REVIEWBOT.md]($repo/blob/main/REVIEWBOT.md#set-up) has the exact steps.
          - **Opt out:** [edit the workflow]($repo/edit/main/.github/workflows/review-bot.yml) and change "if: true" to "if: false".

          Your game and its other checks aren't affected.
          EOF
        env:
          REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
      # A push starts every workflow at once, so wait for the others and keep the
      # logs of any that fail for the bot to read. Empty means they all passed.
      - name: Wait for this commit's other workflows
        if: steps.model.outputs.ready == 'true'
        run: |
          sleep 15
          : > ci-output.txt
          others=$(gh run list --commit "$GITHUB_SHA" --json databaseId,workflowName \
            --jq '.[] | select(.workflowName != "Review Bot") | .databaseId')
          for run in $others; do
            gh run watch "$run" --exit-status > /dev/null && continue
            gh run view "$run" --log-failed >> ci-output.txt || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: denoland/setup-deno@v2.0.5
        if: steps.model.outputs.ready == 'true'
        with:
          deno-version: v2.9.7
      - if: steps.model.outputs.ready == 'true'
        run: npm install --global @opencode/cli
      - name: Review this push
        if: steps.model.outputs.ready == 'true'
        run: >
          opencode run --standalone --agent review-bot
          "Read REVIEWBOT.md and follow its instructions for the bot. Review the push from $BEFORE to $GITHUB_SHA."
        env:
          REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
          BEFORE: ${{ github.event.before }}
          OPENCODE_DISABLE_FREE_MODELS: "1"
          # The model to use and what the agent may do: anything on this throwaway machine,
          # except asking questions, which would hang with nobody here to answer.
          OPENCODE_CONFIG_CONTENT: |
            {
              "providers": {
                "bayleaf": {
                  "env": ["REVIEW_BOT_TOKEN"],
                  "package": "@opencode/ai/providers/openai-compatible",
                  "settings": { "baseURL": "https://api.bayleaf.dev/v1" },
                  "models": {
                    "glm": {
                      "modelID": "openrouter:z-ai/glm-5.3-flash",
                      "capabilities": { "tools": true, "input": ["text"], "output": ["text"] },
                      "limit": { "context": 128000, "output": 16384 }
                    }
                  }
                }
              },
              "agents": {
                "review-bot": {
                  "mode": "primary",
                  "model": "bayleaf/glm",
                  "steps": 80,
                  "permissions": [
                    { "action": "*", "resource": "*", "effect": "allow" },
                    { "action": "question", "resource": "*", "effect": "deny" }
                  ]
                }
              }
            }
      - name: Check a review was written
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s review.md ]; then
            echo "::error title=No review::The agent ran but wrote no review. Check the log above."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: review.md
          retention-days: 1

  # This key can push code, so it lives on a separate machine, with no model and
  # none of the repository's code: it only posts the text of review.md. Green means a review was delivered, whatever it
  # says. Red means there is no review: the comment on the commit or this log says why.
  post:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review
      - name: Comment on the commit
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@review.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stay red until set up or opted out
        if: needs.review.outputs.ready != 'true'
        run: |
          echo "::error title=Review bot not set up::Finish setup or opt out. The comment on this commit explains both."
          exit 1
