# ==============================================================================
# REVIEW BOT: an AI model reviews each push and comments on the commit.
#
# Until you do one of these, every push gets a reminder comment and a red X:
#
# SET UP:
#   1. On https://api.bayleaf.dev/dashboard, under "Temporary inference tokens",
#      open "Create a token". Choose openrouter:z-ai/glm-5.3-flash, set the lifetime
#      to 2592000 seconds (30 days; the default is only one hour), and copy the token.
#   2. In this repository on GitHub, go to Settings > Secrets and variables > Actions
#      > New repository secret. Name it REVIEW_BOT_TOKEN and paste the token. Or run:
#      gh secret set REVIEW_BOT_TOKEN
#   3. Push any commit. Repeat these steps when the token expires.
#
# OPT OUT: it's your choice. Your project doesn't use any of this. Either:
#   - Turn it off: below, under "jobs:" and "review:", change "if: true" to "if: false".
#   - Remove it: delete this file, and REVIEWBOT.md if you like.
#
# REVIEWBOT.md (optional, may be empty) tells the bot what to look for in this
# repository. The bot also follows AGENTS.md, like any agent working here.
# ==============================================================================
name: Review Bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions: {}

# A newer push makes an older review moot.
concurrency:
  group: review-bot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The model runs here and may do anything: run the game, install tools, browse the
  # web. This machine has no key that can change the repository, and only the text of
  # review.md leaves it.
  review:
    if: true # OPT OUT: change true to false to turn the review bot off.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    outputs:
      ready: ${{ steps.model.outputs.ready }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      # Anyone can comment on a public commit, so only the bot's own comments and
      # those of people with access to this repository reach the model.
      - name: Collect past reviews and replies
        run: >
          gh api "repos/$GITHUB_REPOSITORY/comments" --paginate
          --jq '.[] | select(.user.login == "github-actions[bot]" or (.author_association | IN("OWNER", "MEMBER", "COLLABORATOR")))
          | {author: .user.login, commit: .commit_id, created_at, body}'
          > past-comments.jsonl
        env:
          GH_TOKEN: ${{ github.token }}
      # If the model can't be reached, the comment explains how to fix that instead.
      - name: Try one tiny request to the model
        id: model
        run: |
          status=$(curl -s -o /dev/null -w '%{http_code}' https://api.bayleaf.dev/v1/chat/completions \
            -H "Authorization: Bearer $REVIEW_BOT_TOKEN" -H 'Content-Type: application/json' \
            -d '{"model":"openrouter:z-ai/glm-5.3-flash","max_tokens":16,"messages":[{"role":"user","content":"Hi"}]}') || status=none
          [ -n "$REVIEW_BOT_TOKEN" ] || status=missing
          case "$status" in
            200) echo "ready=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            missing) reason="this repository has no REVIEW_BOT_TOKEN secret." ;;
            401) reason="its token has expired or was revoked." ;;
            403) reason="its token doesn't include the model it needs." ;;
            429) reason="your BayLeaf allowance is used up for now. This usually fixes itself within a day." ;;
            *) reason="BayLeaf didn't answer as expected (status $status). If setup looks right, try again later." ;;
          esac
          repo="https://github.com/$GITHUB_REPOSITORY"
          cat > review.md <<EOF
          **Your review bot can't review this push yet: $reason**

          This comment and the red X on the **Review Bot** workflow come back on every push until you do one of two things.

          **Set up:**

          1. On the [BayLeaf dashboard](https://api.bayleaf.dev/dashboard), under **Temporary inference tokens**, open **Create a token**. Choose **openrouter:z-ai/glm-5.3-flash**, set the lifetime to **2592000** seconds (30 days; the default is only one hour), create it, and copy it.
          2. Open [this repository's new secret page]($repo/settings/secrets/actions/new), name the secret **REVIEW_BOT_TOKEN** (for an old token, edit the existing secret instead), and paste the token as its value.
          3. Push any commit.

          **Or opt out:** [edit the workflow]($repo/edit/main/.github/workflows/review-bot.yml) and change "if: true" to "if: false", or delete that file.

          Your project and its other checks aren't affected.
          EOF
        env:
          REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
      # A push starts every workflow at once, so wait for the others and keep the
      # logs of any that fail for the bot to read. Empty means they all passed.
      - name: Wait for this commit's other workflows
        if: steps.model.outputs.ready == 'true'
        run: |
          sleep 15
          : > ci-output.txt
          others=$(gh run list --commit "$GITHUB_SHA" --json databaseId,workflowName \
            --jq '.[] | select(.workflowName != "Review Bot") | .databaseId')
          for run in $others; do
            gh run watch "$run" --exit-status > /dev/null && continue
            gh run view "$run" --log-failed >> ci-output.txt || true
          done
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
      - uses: denoland/setup-deno@v2.0.5
        if: steps.model.outputs.ready == 'true'
        with:
          deno-version: v2.9.7
      - if: steps.model.outputs.ready == 'true'
        run: npm install --global @opencode/cli
      - name: Review this push
        if: steps.model.outputs.ready == 'true'
        run: |
          opencode run --standalone --agent review-bot "$INSTRUCTIONS

          Review the push from $BEFORE to $GITHUB_SHA."
        env:
          REVIEW_BOT_TOKEN: ${{ secrets.REVIEW_BOT_TOKEN }}
          BEFORE: ${{ github.event.before }}
          OPENCODE_DISABLE_FREE_MODELS: "1"
          # Instructions for any repository. REVIEWBOT.md and AGENTS.md add to them.
          INSTRUCTIONS: |
            You are the review bot for this repository. A later step posts review.md as a
            comment on the pushed commit. You have no authority over anyone's grade or
            standing in any course, so never mention grades, points, or deadlines.

            1. Read REVIEWBOT.md if it exists: it may be empty or missing. It says what this
               repository wants from you, and it overrides the defaults below.
            2. Read past-comments.jsonl: your earlier reviews (by github-actions[bot]) and the
               authors' replies. Keep your finding IDs, and take replies seriously.
            3. Inspect the push with Git. If it changed REVIEWBOT.md, AGENTS.md, or this
               workflow, open your review by saying what changed.
            4. Read ci-output.txt, the failure logs from this commit's other workflows. If it
               isn't empty, say so early, point to the first error and what it means, and ask
               a question that leads to the fix.
            5. Check the whole project against what it says it should do, not only this push.
               You're on a throwaway machine and may do anything there that helps. Run the
               software and try it, using a headless browser if it's a web app, instead of only
               reading the code. Check official docs when a finding depends on how a tool or
               API behaves, and link them. Mark each earlier finding resolved, open, or set
               aside with a reason, and give new findings the next free ID.
            6. Write the review to review.md, as plain Markdown text with no images or
               attachments, under 300 words:
               - What I tried: what you actually ran and saw, in a line or two.
               - Going well: what the change does well, including visible habits such as small
                 commits and clear messages.
               - Gaps: each one, where it is, and why it matters to a user. Prefer one or two
                 important observations over a long list.
               - Questions to try: questions that lead the author to a fix. Don't write the fix;
                 short snippets may illustrate an idea, never a complete solution.
               - End with a table of every finding: ID, status, the commit where you first saw
                 it, and a note.
               If the change is trivial, say so in a line, and still end with the table.
          # The model to use and what the agent may do: anything on this throwaway machine.
          OPENCODE_CONFIG_CONTENT: |
            {
              "providers": {
                "bayleaf": {
                  "env": ["REVIEW_BOT_TOKEN"],
                  "package": "@opencode/ai/providers/openai-compatible",
                  "settings": { "baseURL": "https://api.bayleaf.dev/v1" },
                  "models": {
                    "glm": {
                      "modelID": "openrouter:z-ai/glm-5.3-flash",
                      "capabilities": { "tools": true, "input": ["text"], "output": ["text"] },
                      "limit": { "context": 128000, "output": 16384 }
                    }
                  }
                }
              },
              "agents": {
                "review-bot": {
                  "mode": "primary",
                  "model": "bayleaf/glm",
                  "steps": 80,
                  "permissions": [
                    { "action": "*", "resource": "*", "effect": "allow" }
                  ]
                }
              }
            }
      - name: Check a review was written
        if: ${{ !cancelled() }}
        run: |
          if [ ! -s review.md ]; then
            echo "::error title=No review::The agent ran but wrote no review. Check the log above."
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: review
          path: review.md
          retention-days: 1

  # This key can push code, so it lives on a separate machine, with no model and
  # none of the repository's code: it only posts the text of review.md. Green means a review was delivered, whatever it
  # says. Red means there is no review: the comment on the commit or this log says why.
  post:
    needs: review
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: review
      - name: Comment on the commit
        run: gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" -F body=@review.md
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Stay red until set up or opted out
        if: needs.review.outputs.ready != 'true'
        run: |
          echo "::error title=Review bot not set up::Finish setup or opt out. The comment on this commit explains both."
          exit 1
